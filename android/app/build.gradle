plugins {
    id 'com.android.application' version '8.9.2'
}

def catalog = rootProject.file('../dist-data/android/recipes.sqlite')
def recipePhotos = rootProject.file('../dist-data/android/recipe-photos.zip')
def catalogAssets = layout.buildDirectory.dir('generated/catalog-assets')

android {
    namespace 'app.dinnerpicker'
    compileSdk 35

    defaultConfig {
        applicationId 'app.dinnerpicker'
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(catalogAssets)
}

def prepareCatalog = tasks.register('prepareCatalog', Sync) {
    from(catalog)
    from(zipTree(recipePhotos)) {
        into('photos')
    }
    into(catalogAssets)
    inputs.files(catalog, recipePhotos)
}

tasks.named('preBuild').configure {
    dependsOn(prepareCatalog)
}
